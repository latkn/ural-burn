  <div id="cookie-consent-banner" class="cookie-banner" hidden>
    <div class="cookie-banner__inner">
      <p>
        Мы используем cookie для корректной работы сайта и улучшения сервиса. Вы можете принять все cookie
        или оставить только необходимые. Подробнее: <a href="/privacy.html">политика конфиденциальности</a>.
      </p>
      <div class="cookie-banner__actions">

        <button type="button" class="cookie-banner__btn cookie-banner__btn--primary" id="cookie-accept-btn">Принять все cookie</button>

  <script>
    (function () {
      var CONSENT_KEY = 'uralburn_cookie_consent';
      var banner = document.getElementById('cookie-consent-banner');
      var acceptBtn = document.getElementById('cookie-accept-btn');
      var necessaryBtn = document.getElementById('cookie-necessary-btn');
      if (!banner || !acceptBtn || !necessaryBtn) return;

      function saveConsent(value) {
        try {
          localStorage.setItem(CONSENT_KEY, value);
        } catch (e) {
          // ignore
        }
      }

      var current = null;
      try {
        current = localStorage.getItem(CONSENT_KEY);
      } catch (e) {
        // ignore
      }
      if (current !== 'analytics' && current !== 'necessary') {
        banner.hidden = false;
      }

      necessaryBtn.addEventListener('click', function () {
        saveConsent('necessary');
        banner.hidden = true;
      });

      acceptBtn.addEventListener('click', function () {
        saveConsent('analytics');
        if (typeof window.__uralburnLoadMetrika === 'function') {
          window.__uralburnLoadMetrika();
        }
        banner.hidden = true;
      });
    })();
  </script>
